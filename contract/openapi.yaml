components:
  schemas:
    ApplicationOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        student_id:
          type: string
          format: uuid
          title: Student Id
        opportunity_id:
          type: string
          format: uuid
          title: Opportunity Id
        opportunity_slug:
          type: string
          title: Opportunity Slug
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        ordered_items:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Ordered Items
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - student_id
      - opportunity_id
      - opportunity_slug
      - status
      - ordered_items
      - updated_at
      title: ApplicationOut
    ApplicationStatus:
      type: string
      enum:
      - portal_inspection_pending
      - portal_mapped
      - preparing
      - waiting_for_requirements
      - ready_for_review
      - approved_for_execution
      - executing
      - verifying_submission
      - submitted
      - submission_kit_exported
      title: ApplicationStatus
    AuthStep:
      type: string
      enum:
      - login
      - oauth
      - email_otp
      - captcha
      - mfa
      title: AuthStep
    AutomationPolicy:
      type: string
      enum:
      - permitted
      - explicitly_banned
      title: AutomationPolicy
    BankStatementPullIn:
      properties:
        provider:
          type: string
          title: Provider
          default: mono
        institution_name:
          type: string
          title: Institution Name
          default: Access Bank
        account_masked:
          type: string
          title: Account Masked
          default: '****3410'
        months:
          type: integer
          maximum: 24.0
          minimum: 1.0
          title: Months
          default: 6
      type: object
      title: BankStatementPullIn
    CanvasRewriteIn:
      properties:
        prompt_id:
          type: string
          minLength: 1
          title: Prompt Id
        instruction:
          type: string
          title: Instruction
          default: Refine draft
        replacement_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Replacement Text
      type: object
      required:
      - prompt_id
      title: CanvasRewriteIn
    Claim_AutomationPolicy_:
      properties:
        value:
          anyOf:
          - $ref: '#/components/schemas/AutomationPolicy'
          - type: 'null'
        verification:
          $ref: '#/components/schemas/Verification'
        evidence:
          items:
            $ref: '#/components/schemas/EvidenceRef'
          type: array
          title: Evidence
          default: []
        last_verified_at:
          type: string
          format: date-time
          title: Last Verified At
      type: object
      required:
      - value
      - verification
      - last_verified_at
      title: Claim[AutomationPolicy]
    Claim_SemesterState_:
      properties:
        value:
          anyOf:
          - $ref: '#/components/schemas/SemesterState'
          - type: 'null'
        verification:
          $ref: '#/components/schemas/Verification'
        evidence:
          items:
            $ref: '#/components/schemas/EvidenceRef'
          type: array
          title: Evidence
          default: []
        last_verified_at:
          type: string
          format: date-time
          title: Last Verified At
      type: object
      required:
      - value
      - verification
      - last_verified_at
      title: Claim[SemesterState]
    Claim_str_:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
        verification:
          $ref: '#/components/schemas/Verification'
        evidence:
          items:
            $ref: '#/components/schemas/EvidenceRef'
          type: array
          title: Evidence
          default: []
        last_verified_at:
          type: string
          format: date-time
          title: Last Verified At
      type: object
      required:
      - value
      - verification
      - last_verified_at
      title: Claim[str]
    CurationOutcome:
      properties:
        eligible:
          type: boolean
          title: Eligible
        failed_hard_rules:
          items:
            type: string
          type: array
          title: Failed Hard Rules
        application:
          anyOf:
          - $ref: '#/components/schemas/ApplicationOut'
          - type: 'null'
      type: object
      required:
      - eligible
      - failed_hard_rules
      title: CurationOutcome
    DocumentType:
      type: string
      enum:
      - waec_result
      - jamb_result
      - school_admission_letter
      - jamb_admission_letter
      - school_id
      - nin_slip
      - passport_photo
      - cv
      - transcript
      - lga_certificate
      - bank_statement
      - dynamic_endorsement
      title: DocumentType
    EvidenceLedgerIn:
      properties:
        category:
          type: string
          maxLength: 60
          minLength: 2
          title: Category
        title:
          type: string
          minLength: 2
          title: Title
        fact_text:
